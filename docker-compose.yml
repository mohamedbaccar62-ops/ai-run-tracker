version: "3.8"

services:
  mlflow:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - tracker-data:/app
    command: >
      sh -c "pip install -q mlflow && mlflow server
             --host 0.0.0.0 --port 5000
             --backend-store-uri /app/mlruns
             --default-artifact-root /app/mlruns"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  dashboard:
    build: .
    working_dir: /app
    volumes:
      - tracker-data:/app:ro
    command: >
      sh -c "streamlit run ai_run_tracker/dashboard/app.py
             --server.headless true
             --server.port 8501
             --server.enableCORS false"
    ports:
      - "8501:8501"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  n8n:
    image: n8nio/n8n:1.66.0
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Berlin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  pipeline:
    build: .
    working_dir: /app
    volumes:
      - tracker-data:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/pipeline-alert
    depends_on:
      mlflow:
        condition: service_healthy
    profiles:
      - tools

volumes:
  tracker-data:
  n8n-data:
